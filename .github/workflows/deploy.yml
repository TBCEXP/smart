name: Deploy to RackNerd VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      deploy_enabled: ${{ steps.check.outputs.deploy_enabled }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_USER }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
            echo "VPS secrets configured — will deploy"
          else
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::跳过 VPS 部署：请在 GitHub Secrets 配置 VPS_HOST / VPS_USER / VPS_SSH_KEY"
          fi

  preflight-only:
    needs: check-secrets
    if: needs.check-secrets.outputs.deploy_enabled == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy preflight (repo only)
        run: bash scripts/deploy_preflight.sh

      - name: Production onboarding hint
        run: |
          echo "::notice::VPS 未配置 — 请配置 GitHub Secrets 后 push 将自动部署"
          bash scripts/delivery_complete.sh --static-only
          bash scripts/onboard_checklist.sh 2>/dev/null | head -25 || true

  deploy:
    needs: check-secrets
    if: needs.check-secrets.outputs.deploy_enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/smart-crm
            export DEPLOY_BRANCH=main
            export IMAGE_TAG=${{ github.sha }}
            export VERSION=2.1.0
            export BUILD_SHA=${{ github.sha }}
            bash scripts/upgrade.sh

      - name: Verify health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            curl -sf http://127.0.0.1:8000/api/health
            curl -sf http://127.0.0.1:8000/api/system/readiness | head -c 500
            echo ""
            echo " Deploy OK: ${{ github.sha }}"

      - name: Post-deploy verify
        uses: appleboy/ssh-action@v1.2.0
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/smart-crm
            bash scripts/ready.sh http://127.0.0.1:8000 --skip-preflight
