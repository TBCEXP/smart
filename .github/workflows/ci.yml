name: CI — Smoke & Build

on:
  push:
    branches: [main, cursor/**]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: smart-crm/requirements.txt

      - name: Install dependencies
        run: pip install -r smart-crm/requirements.txt

      - name: Start app (SQLite)
        run: |
          cd smart-crm
          mkdir -p data
          USE_SQLITE=1 uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done

      - name: Smoke test
        run: bash scripts/smoke_test.sh http://127.0.0.1:8000

      - name: Phase 1.5 quick verify
        run: bash scripts/phase15_verify.sh http://127.0.0.1:8000 --quick

  postgres-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's/change-me-to-random-32-chars-min/ci-test-secret-32chars-minimum-ok/' .env

      - name: Start Postgres + smart-crm
        run: |
          export VERSION=ci-postgres
          docker compose up -d postgres
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U smartcrm && break
            sleep 2
          done
          docker compose build smart-crm
          docker compose up -d smart-crm
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 3
          done

      - name: Smoke on Postgres (pgvector)
        run: |
          curl -sf http://127.0.0.1:8000/api/kb/status | grep -q '"search_engine":"pgvector"'
          bash scripts/smoke_test.sh http://127.0.0.1:8000

      - name: Integrations probe
        run: |
          curl -sf -X POST http://127.0.0.1:8000/api/integrations/probe | grep -q probes
          curl -sf http://127.0.0.1:8000/api/system/readiness | grep -q checklist

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build smart-crm image
        run: docker build -t smart-crm:ci smart-crm
