brainstorm_system: |
  You are a B2B foreign trade strategist for kitchen and hotel supplies exporters.
  Given country, city, L3 category, and optional market intel, produce structured JSON only.
  Focus on importers, distributors, OEM buyers, and hospitality wholesalers.
  Output JSON with keys: icp, keywords (es/en arrays), channel_plan, seeds, action_plan.
  keywords.es must have 5-10 actionable Exa search phrases in Spanish.
  seeds.similar_search_queries must use category:company prefix where appropriate.
  Never return markdown or prose outside JSON.

brainstorm_output_schema:
  icp:
    buyer_types: []
    company_size: ""
    website_signals: []
    decision_makers: []
  keywords:
    es: []
    en: []
  channel_plan:
    - channel: email
      priority: 1
      rationale: ""
    - channel: whatsapp
      priority: 2
      rationale: ""
  seeds:
    companies: []
    similar_search_queries: []
    tradeshows: []
    hs_codes: []
  action_plan:
    week1: ""
    week2: ""
    week3: ""
    week4: ""

similar_company_templates:
  - "category:company importers of {product} similar to {anchor_brand} in {country}"
  - "distributors that sell products like {anchor_brand} {category_l3} in {city} {country}"
  - "companies that supply hotels restaurant equipment wholesale {city} {country}"
  - "category:company mayorista utensilios cocina hostelería {city} {country}"
  - "category:company fabricante moldes repostería bakeware exportador {country}"

exa_query_templates:
  cookware-commercial:
    es: "fabricante o mayorista utensilios cocina acero inoxidable hostelería {city} {country} OEM"
    en: "commercial stainless steel cookware wholesaler distributor {city} {country}"
  bakeware:
    es: "fabricante moldes repostería bakeware mayorista {city} {country} exportador"
    en: "bakeware manufacturer wholesaler {city} {country} exporter"
  flatware:
    es: "distribuidor vajilla cubertería acero inoxidable hoteles restaurantes {country}"
    en: "hotel flatware dinnerware distributor {country}"
  food-storage:
    es: "proveedor contenedores alimentos comercial GN pan hospitality {city} {country}"
    en: "commercial food storage containers hospitality supplier {city} {country}"
  buffet:
    es: "equipamiento buffet hoteles banquetes mayorista {country}"
    en: "buffet banquet equipment hotel wholesaler {country}"
  kitchen-tools:
    es: "importador utensilios cocina profesional wholesale {city} {country}"
    en: "professional kitchen tools importer wholesale {city} {country}"

outreach:
  hospitality_es:
    system: |
      You write B2B cold outreach for kitchen/hotel supplies exporters targeting Latin America.
      Return JSON only with keys:
        email_body (Spanish, 150-220 words, professional),
        subject_lines (array of 2 Spanish subject lines),
        lead_score (A/B/C based on website fit for wholesale/OEM),
        whatsapp_intro (Spanish, max 280 chars, casual-professional).
      Mention MOQ, lead time, NSF/EU food contact certification, OEM capability when relevant.
      Reference something specific from the company website summary.
    whatsapp_template: |
      Hola {contact_name}, soy {sender_name} de {company}.
      Vimos que {company_signal}. Fabricamos {category_l3} con certificación alimentaria y OEM.
      MOQ desde {moq}. ¿Le interesa recibir catálogo y precios mayoristas?
    email_structure:
      - greeting
      - market_observation
      - product_fit
      - moq_certifications
      - cta

feishu_extended_fields:
  - 线索评分
  - 主题行
  - 批次 ID
  - 处理状态
  - 产品品类 L3
  - 语言
  - 国家
  - 首选渠道

track_b_prompt: |
  Analyze scraped product catalog pages from a hospitality/kitchen anchor company.
  Summarize top L3 categories, price bands, materials, and differences vs US Choice/Winco benchmarks.
  Return JSON with keys: top_l3 (array), l3_heat (object), product_examples (array),
  trend_summary (string), sales_signal (high/medium/low).

track_c_hs_defaults:
  cookware-commercial: ["732393", "73239390"]
  bakeware: ["761510", "732393"]
  flatware: ["821599", "732393"]
  food-storage: ["392410", "732393"]
  buffet: ["732393", "761510"]
  kitchen-tools: ["821599", "732393"]

content_studio:
  system: |
    You are a B2B SEO copywriter for kitchen and hotel supplies exporters.
    Write in the requested language (es/pt/en/fr). Return JSON only.
    Focus on wholesale buyers, MOQ, certifications (NSF, EU food contact), OEM.
    Slug must be URL-safe lowercase with hyphens, no accents.
    meta_title max 60 chars, meta_description max 155 chars.
    meta_keywords: array of 5-12 relevant SEO keywords/phrases.
  types:
    seo_pack:
      instructions: |
        Generate a complete SEO pack for a B2B product page. No long article body needed.
      output_fields:
        - title
        - slug
        - meta_title
        - meta_description
        - meta_keywords
        - h1
        - product_description_short
        - bullet_features
        - seo_notes
    product_description:
      instructions: |
        Write B2B product description for catalog/PDF. Include specs placeholders, MOQ, OEM.
      output_fields:
        - title
        - slug
        - meta_title
        - meta_description
        - meta_keywords
        - h1
        - product_description_short
        - product_description_long
        - bullet_features
        - cta
    category_page:
      instructions: |
        Write a category landing page for hospitality/kitchen wholesale (300-500 words markdown).
      output_fields:
        - title
        - slug
        - meta_title
        - meta_description
        - meta_keywords
        - h1
        - body_markdown
        - bullet_features
    blog_article:
      instructions: |
        Write an SEO blog article for foreign trade buyers (600-900 words markdown).
        Include internal linking suggestions in seo_notes.
      output_fields:
        - title
        - slug
        - meta_title
        - meta_description
        - meta_keywords
        - h1
        - body_markdown
        - seo_notes
