<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMART CRM — 客户门户</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/80">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">客户门户</h1>
        <p id="user-info" class="text-xs text-slate-400">订单 · 授权目录</p>
      </div>
      <button id="btn-logout" class="px-3 py-1 rounded bg-slate-800 text-sm">退出</button>
    </div>
    <nav class="max-w-5xl mx-auto px-4 flex gap-2 pb-2">
      <button data-tab="orders" class="tab-btn active">我的订单</button>
      <button data-tab="catalogs" class="tab-btn">授权目录</button>
      <button data-tab="quotes" class="tab-btn">报价单</button>
    </nav>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-6">
    <section id="tab-orders">
      <div id="summary" class="card mb-4 text-sm text-slate-400"></div>
      <div id="order-detail" class="card mb-4 hidden text-sm"></div>
      <div id="orders-list" class="space-y-3"></div>
    </section>
    <section id="tab-catalogs" class="hidden">
      <p class="text-sm text-slate-400 mb-3">仅显示授权给您的工厂 PDF 目录。R2 配置后可一键下载。</p>
      <div id="catalogs-list" class="space-y-3"></div>
    </section>
    <section id="tab-quotes" class="hidden">
      <p class="text-sm text-slate-400 mb-3">授权 FOB 报价单与价目表（PDF 元数据，R2 配置后可下载）。</p>
      <div id="quotes-list" class="space-y-3"></div>
    </section>
  </main>
  <script>
    const token = localStorage.getItem('session_token');
    if (!token) location.href = '/portal';
    const headers = () => ({ 'X-Session-Token': token });

    document.querySelectorAll('[data-tab]').forEach((btn) => {
      btn.onclick = () => {
        document.querySelectorAll('[data-tab]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-orders').classList.toggle('hidden', btn.dataset.tab !== 'orders');
        document.getElementById('tab-catalogs').classList.toggle('hidden', btn.dataset.tab !== 'catalogs');
        document.getElementById('tab-quotes').classList.toggle('hidden', btn.dataset.tab !== 'quotes');
        if (btn.dataset.tab === 'catalogs') loadCatalogs();
        if (btn.dataset.tab === 'quotes') loadQuotes();
      };
    });

    async function loadOrders() {
      const data = await fetch('/api/portal/overview', { headers: headers() }).then((r) => r.json());
      if (!data.email) { location.href = '/portal'; return; }
      document.getElementById('user-info').textContent = data.email;
      document.getElementById('summary').textContent = `${data.orders_count} 个订单`;
      document.getElementById('orders-list').innerHTML = (data.orders || []).map((o) => `
        <div class="card text-sm cursor-pointer hover:border-emerald-700" data-oid="${o.id}" onclick="viewOrder('${o.id}')">
          <div class="flex justify-between"><strong class="text-emerald-400">${o.order_no}</strong><span>${o.status}</span></div>
          <div>${o.customer_name} · ${o.currency} ${o.total_amount}</div>
        </div>`).join('') || '<p class="text-slate-500">暂无订单</p>';
    }

    async function viewOrder(id) {
      const o = await fetch('/api/portal/orders/' + id, { headers: headers() }).then((r) => r.json());
      const el = document.getElementById('order-detail');
      el.classList.remove('hidden');
      el.innerHTML = `
        <div class="flex justify-between items-start mb-3">
          <div>
            <h2 class="text-lg font-bold text-emerald-400">${o.order_no}</h2>
            <p class="text-slate-400">${o.customer_name} · ${o.country_iso || '-'}</p>
          </div>
          <span class="px-2 py-1 rounded bg-slate-800 text-xs">${o.status}</span>
        </div>
        <p class="mb-3">合计 <strong>${o.currency} ${o.total_amount}</strong></p>
        <table class="w-full text-xs">
          <tr class="text-slate-500 border-b border-slate-700">
            <th class="text-left py-2">SKU</th><th class="text-left">产品</th><th>数量</th><th>单价</th>
          </tr>
          ${(o.lines || []).map((l) => `
            <tr class="border-b border-slate-800">
              <td class="py-2">${l.sku || '-'}</td>
              <td>${l.product_name}</td>
              <td class="text-center">${l.qty}</td>
              <td class="text-right">${l.unit_price}</td>
            </tr>`).join('') || '<tr><td colspan="4" class="py-4 text-slate-500">暂无货号行</td></tr>'}
        </table>
        <button class="text-xs text-slate-500 mt-3" onclick="document.getElementById('order-detail').classList.add('hidden')">收起</button>`;
      document.querySelectorAll('[data-oid]').forEach((n) => n.classList.remove('ring-2', 'ring-emerald-600'));
      const card = document.querySelector('[data-oid="' + id + '"]');
      if (card) card.classList.add('ring-2', 'ring-emerald-600');
    }

    async function loadCatalogs() {
      const list = await fetch('/api/portal/catalogs?doc_type=catalog', { headers: headers() }).then((r) => r.json());
      document.getElementById('catalogs-list').innerHTML = renderDocList(list, 'catalogs-list');
    }

    async function loadQuotes() {
      const list = await fetch('/api/portal/quotes', { headers: headers() }).then((r) => r.json());
      document.getElementById('quotes-list').innerHTML = renderDocList(list, 'quotes-list');
    }

    function renderDocList(list, _id) {
      return (list || []).map((c) => {
        const status = c.storage === 'r2_pending'
          ? '<span class="text-amber-400">PDF 待 R2 部署</span>'
          : (c.download_url
            ? `<a class="text-emerald-400 underline" href="${c.download_url}" target="_blank" rel="noopener">下载 PDF</a>`
            : `<button class="text-emerald-400 underline" onclick="fetchDownload('${c.id}')">获取下载链接</button>`);
        const typeLabel = c.doc_type === 'quote' ? '报价' : (c.doc_type === 'price_list' ? '价目' : '目录');
        return `
        <div class="card text-sm">
          <strong>${c.title}</strong> <span class="text-slate-500">(${c.factory_code} · ${typeLabel})</span>
          <div class="text-slate-400">${c.category_l3} · ${c.pages} 页 · ${c.file_size_mb} MB</div>
          <div class="text-xs mt-1">${status}</div>
        </div>`;
      }).join('') || '<p class="text-slate-500">暂无授权文件</p>';
    }

    async function fetchDownload(id) {
      const data = await fetch('/api/catalog/documents/' + id + '/download-url', { headers: headers() }).then((r) => r.json());
      if (data.download_url) window.open(data.download_url, '_blank');
      else alert(data.detail || data.storage_detail || '暂无可下载文件');
    }

    document.getElementById('btn-logout').onclick = () => {
      localStorage.removeItem('session_token');
      location.href = '/portal';
    };
    loadOrders();
  </script>
</body>
</html>
